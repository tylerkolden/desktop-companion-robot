<g font-family="Segoe UI, sans-serif" fill="#183d35"><text x="40" y="48" font-size="28" font-weight="bold">V4: two screws. No snap tabs.</text><text x="40" y="80" font-size="17">Assembly guide — schematic, not to scale. Repeat the fastener stack at both ears.</text>

<g font-size="18"><text x="740" y="198">M2 x 10mm screw</text><text x="740" y="239">Flat washer</text><text x="740" y="288">Blue servo mounting ear</text><text x="740" y="357">Printed plate (4mm)</text><text x="740" y="417">Flat washer</text><text x="740" y="455">M2 nut — hold with pliers</text></g>
<text x="580" y="520" font-size="17">Tighten only until washers stop rattling.</text><text x="580" y="548" font-size="17">Do not bend or crush the blue ear.</text>
<text x="40" y="615" font-size="16">Print one. Check fit with power off. Keep the plug attached. No powered movement in this checkpoint.</text></g></svg>